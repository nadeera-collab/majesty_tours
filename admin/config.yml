backend:
  name: git-gateway
  branch: main

media_folder: assets
public_folder: assets

collections:
  - name: "site"
    label: "Website Content"
    files:

      - label: "Contact & Info"
        name: "contact"
        file: "content.json"
        format: json
        fields:
          - label: "Contact Details"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Primary Phone", name: "phone_primary", widget: "string" }
              - { label: "Secondary Phone", name: "phone_secondary", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

          - label: "Platform Links"
            name: "platforms"
            widget: "object"
            fields:
              - { label: "Google Business URL", name: "google", widget: "string" }
              - { label: "TripAdvisor URL", name: "tripadvisor", widget: "string" }
              - { label: "Airbnb Experiences URL", name: "airbnb", widget: "string" }
              - { label: "GetYourGuide URL", name: "getyourguide", widget: "string" }
              - { label: "Viator URL", name: "viator", widget: "string" }
              - { label: "TourRadar URL", name: "tourradar", widget: "string" }

          - label: "Social Media Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Facebook URL", name: "facebook", widget: "string" }
              - { label: "TikTok URL", name: "tiktok", widget: "string" }

          - label: "Stats"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Years Guiding", name: "years", widget: "number" }
              - { label: "Routes Mapped", name: "routes", widget: "number" }
              - { label: "Traveller Rating", name: "rating", widget: "number", value_type: "float" }

          - label: "Tours"
            name: "tours"
            widget: "list"
            allow_add: false
            minimize_collapsed: true
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tags / Destinations", name: "tags", widget: "string" }
              - { label: "Price (e.g. from $390)", name: "price", widget: "string" }
              - { label: "Duration (e.g. 4 days · private)", name: "duration", widget: "string" }
              - label: "Slideshow Images"
                name: "images"
                widget: "list"
                allow_add: true
                allow_delete: true
                minimize_collapsed: true
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }

      - label: "Gallery Photos"
        name: "gallery"
        file: "gallery.json"
        format: json
        fields:
          - label: "Gallery Items"
            name: "items"
            widget: "list"
            allow_add: true
            allow_delete: true
            minimize_collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Set this for a photo item. Leave blank for a video item." }
              - { label: "Video", name: "video", widget: "file", required: false, hint: "Set this + Video Poster for a video item (.mp4). Leave blank for a photo item." }
              - { label: "Video Poster", name: "poster", widget: "image", required: false, hint: "Thumbnail shown before the video plays. Required when Video is set." }
              - { label: "Caption", name: "caption", widget: "string" }
